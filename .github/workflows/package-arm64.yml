name: Linux x64 and ARM64 offline packages
on:
  workflow_dispatch:
  push:
    branches:
      - feat/ascend-ocr-framework
      - feat/model-plugin-layout-v3
      - main
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  linux-package:
    name: Native ${{ matrix.arch }} build and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, machine: x86_64, runner: ubuntu-24.04}
          - {arch: arm64, machine: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install build and document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ file libcurl4-openssl-dev libtiff-dev nlohmann-json3-dev poppler-utils libreoffice fonts-noto-core libmicrohttpd-dev python3-reportlab python3-pil
      - name: Build native executable (${{ matrix.arch }})
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          bash -n packaging/make-linux.sh packaging/run-linux.sh packaging/verify-linux.sh
          cmake -S . -B build-${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release -DOMNIOCR_WITH_ACL=OFF -DOMNIOCR_WITH_ONNX=OFF -DOMNIOCR_WITH_SERVER=ON
          cmake --build build-${{ matrix.arch }} -j2
          ctest --test-dir build-${{ matrix.arch }} --output-on-failure
      - name: Assemble offline archive and smoke test
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --always | tr -c 'A-Za-z0-9._-' '-')"
          name="omniocr-${version}-linux-${{ matrix.arch }}-offline"
          bash packaging/make-linux.sh build-${{ matrix.arch }} "$RUNNER_TEMP/$name" "${{ matrix.arch }}"
          (cd "$RUNNER_TEMP/$name" && ./verify.sh)
          export PACKAGE_DIR="$RUNNER_TEMP/$name"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          python3 tests/server_integration.py "$RUNNER_TEMP/$name/server.sh"
          python3 tests/v3_http_integration.py "$RUNNER_TEMP/$name/run.sh"
          python3 tests/external_plugin_integration.py "$RUNNER_TEMP/$name/run.sh" "$RUNNER_TEMP/$name/server.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])
          bundle=Path(os.environ['PACKAGE_DIR'])
          (root/'fixture.ppm').write_bytes(b'P6\n20 10\n255\n'+b'\xff'*600)
          os.system('true')
          import subprocess
          subprocess.run([str(bundle/'run.sh'),'--config',str(bundle/'configs/demo.json'),'--input',str(root/'fixture.ppm'),'--output',str(root/'smoke-output')],check=True)
          assert (root/'smoke-output/result.json').is_file()
          PY
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ARCHIVE=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=$RUNNER_TEMP/$name.tar.gz.sha256" >> "$GITHUB_ENV"
      - name: Upload architecture-specific offline package
        uses: actions/upload-artifact@v4
        with:
          name: omniocr-linux-${{ matrix.arch }}-offline
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 30
