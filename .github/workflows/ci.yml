name: C++ build and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libtiff-dev nlohmann-json3-dev poppler-utils libreoffice libmicrohttpd-dev calibre maven default-jdk
          python3 -m pip install python-docx python-pptx openpyxl reportlab pillow
      - name: Build OFD converter
        run: mvn -B -f tools/ofd-converter/pom.xml package
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOMNIOCR_WITH_SERVER=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python3 tests/document_integration.py build/omniocr
          python3 tests/input_formats_integration.py build/omniocr --external --ofd-converter tools/omniocr-ofd-to-pdf
          python3 tests/batch_integration.py build/omniocr
          python3 tests/v3_http_integration.py build/omniocr
          python3 tests/external_plugin_integration.py build/omniocr build/omniocr-server
          python3 tests/server_integration.py build/omniocr-server --formats
          python3 tests/server_performance_integration.py build/omniocr-server
          python3 tests/server_admission_integration.py build/omniocr-server
          python3 tests/dynamic_batch_integration.py build/omniocr-server
          python3 tests/backend_concurrency_integration.py build/omniocr
          python3 tests/box_concurrency_integration.py build/omniocr build/omniocr-server
          for config in configs/*.json; do build/omniocr --config "$config" --validate; done
  onnx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libtiff-dev nlohmann-json3-dev
          python3 -m pip install onnx
          curl -fL https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C /tmp
      - name: Build and execute ONNX graphs
        run: |
          cmake -S . -B build -DOMNIOCR_WITH_ONNX=ON -DONNXRUNTIME_ROOT=/tmp/onnxruntime-linux-x64-1.24.2
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python3 tests/onnx_integration.py build/omniocr
